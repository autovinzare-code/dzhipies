# Проверка на утечку ключей и паролей при каждом изменении.
# Если в коде или истории появится токен бота, ключ service_role, пароль и т.п., проверка станет красной.
name: Поиск секретов

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Скачать gitleaks и проверить контрольную сумму
        env:
          GITLEAKS_VERSION: 8.29.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Проверить весь код и историю
        run: ./gitleaks git . --redact --verbose --exit-code 1
